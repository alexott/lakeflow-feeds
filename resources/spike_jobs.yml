    feed_urlhaus_payloads:
      name: "feed urlhaus_payloads"
      <<: [*env, *run_as]
      max_concurrent_runs: 1
      tags: {feed: urlhaus_payloads}
      parameters:
        - {name: force, default: "false"}
      schedule: {quartz_cron_expression: "0 42 * * * ?", timezone_id: UTC}
      tasks:
        - task_key: collect
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.collect_feed
            parameters:

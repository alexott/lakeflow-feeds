    feed_cisco_umbrella_top1m:
      name: "feed cisco_umbrella_top1m"
      <<: [*env, *run_as]
      max_concurrent_runs: 1
      tags: {feed: cisco_umbrella_top1m}
      parameters:
        - {name: force, default: "false"}
      # Published about 01:40 UTC.
      schedule: {quartz_cron_expression: "0 0 2 * * ?", timezone_id: UTC}
      tasks:
        - task_key: wait
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.FeedChangedSensor

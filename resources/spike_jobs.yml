x-env: &env
  environments:
    - environment_key: feeds_environment
      spec:
        environment_version: "5"
        dependencies:
          - ../dist/*.whl

x-run-as: &run_as
  run_as:
    service_principal_name: ${var.sp_application_id}
  # Standard mode: same SKU, fewer DBUs, 4-6 min more startup. Feeds are hourly or daily, so the delay is fine.
  performance_target: STANDARD

resources:
  jobs:
    feeds_probe:
      name: "feeds probe"
      <<: [*env, *run_as]
      parameters:
        - {name: connection, default: ""}
      tasks:
        - task_key: probe
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.probe.probe_runtime
            parameters:
              - {name: connection, value: "{{job.parameters.connection}}"}

    feed_tor_exit_nodes:
      name: "feed tor_exit_nodes"
      <<: [*env, *run_as]
      max_concurrent_runs: 1
      tags: {feed: tor_exit_nodes}
      parameters:
        - {name: force, default: "false"}
      schedule: {quartz_cron_expression: "0 7 * * * ?", timezone_id: UTC}
      tasks:
        - task_key: collect
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.collect_feed
            parameters:
              - {name: feed, value: tor_exit_nodes}
              - {name: registry_dir, value: "${workspace.file_path}/registry"}
              - {name: force, value: "{{job.parameters.force}}"}

    feed_feodo_ipblocklist:
      name: "feed feodo_ipblocklist"
      <<: [*env, *run_as]
      max_concurrent_runs: 1
      tags: {feed: feodo_ipblocklist}
      parameters:
        - {name: force, default: "false"}
      schedule: {quartz_cron_expression: "0 17 * * * ?", timezone_id: UTC}
      tasks:
        - task_key: collect
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.collect_feed
            parameters:
              - {name: feed, value: feodo_ipblocklist}
              - {name: registry_dir, value: "${workspace.file_path}/registry"}
              - {name: force, value: "{{job.parameters.force}}"}

    feed_otx_indicators:
      name: "feed otx_indicators"
      <<: [*env, *run_as]
      max_concurrent_runs: 1
      tags: {feed: otx_indicators}
      parameters:
        - {name: force, default: "false"}
      schedule: {quartz_cron_expression: "0 52 * * * ?", timezone_id: UTC}
      tasks:
        - task_key: collect
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.collect_feed
            parameters:
              - {name: feed, value: otx_indicators}
              - {name: registry_dir, value: "${workspace.file_path}/registry"}

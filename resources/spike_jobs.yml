        - {name: force, default: "false"}
      schedule: {quartz_cron_expression: "0 33 1/12 * * ?", timezone_id: UTC}
      tasks:
        - task_key: collect
          max_retries: 2
          min_retry_interval_millis: 300000
          environment_key: feeds_environment
          python_operator_task:
            main: feedkit.integrations.collect_feed
            parameters:
              - {name: feed, value: gcp_ip_ranges}
              - {name: registry_dir, value: "${workspace.file_path}/registry"}
              - {name: force, value: "{{job.parameters.force}}"}

    # Both Cloudflare lists in one job: the two parallel tasks share compute (cost test for grouped feeds).
    feed_cloudflare_ips:
      name: "feed cloudflare_ips"
      <<: [*env, *run_as]
      max_concurrent_runs: 1

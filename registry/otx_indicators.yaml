name: otx_indicators
mode: merge
key: [observable_type, value]
category: ioc
effect: block
fetch:
  operator: http_snapshot
  url: https://otx.alienvault.com/api/v1/indicators/export
  format: json
  headers: {X-OTX-API-KEY: "{{secrets/otx/api_key}}"}
  # From the last commit with 1 h overlap. OTX refuses more than 100,000 indicators per window
  # (about 24 h of data), so the window never starts more than 12 h back (first run and after outages);
  # older history is in the filebeat-loaded cybersecurity.threatintel.iocs. 1,000 items per page.
  cursor: {param: modified_since, first_lookback_hours: 12, overlap_minutes: 60, max_lookback_hours: 12}
  # One series per type, so a burst in one type (seen: 109k URLs from one pulse update) cannot block the
  # others; a type over 95 pages is truncated (manifest truncated: true) instead of failing every run.
  pagination: {next: next, records: results, max_pages: 95, on_limit: truncate}
  split_by:
    param: types
    values: [IPv4, IPv6, domain, hostname, URL, URI, FileHash-MD5, FileHash-SHA1, FileHash-SHA256, CIDR, email, CVE]
change_detection: none
schedule: {every: 1h}
sink: zerobus
curation: views
targets: [tables, datasource]
transform:
  - records: "results[]"
  - map:
      field: type
      to: observable_type
      values: {IPv4: ip, IPv6: ip, domain: domain, hostname: hostname, URL: url, URI: url,
               FileHash-MD5: hash, FileHash-SHA1: hash, FileHash-SHA256: hash, CIDR: net_addr,
               email: email, CVE: cve}
      default: drop
  - apply: {indicator: [trim]}
  - drop_if_empty: [indicator]
  - output:
      value: indicator
      observable_type: observable_type
      attrs: {otx_id: id, otx_type: type, title: title, description: description}
validate: {min_records: 0}
expiry: {max_age_days: 90}
license: "AlienVault OTX (LevelBlue), OTX terms of use (https://otx.alienvault.com/)"
